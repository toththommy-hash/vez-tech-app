<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Teszt Csatlakozás</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
  <div class="container" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
      <h4 class="mb-3">Google Apps Script Kapcsolat Teszt</h4>
      
      <div class="mb-3">
        <label class="form-label fw-bold">PIN Kód:</label>
        <input type="text" id="pin" class="form-control" value="1234">
      </div>

      <button id="testBtn" onclick="runTest()" class="btn btn-primary w-100 mb-3">
        Teszt Adat Küldése (POST)
      </button>

      <div class="mb-2 fw-bold">Eredmény / Napló:</div>
      <pre id="log" class="p-3 bg-dark text-light rounded" style="min-height: 150px; white-space: pre-wrap;"></pre>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUGJPmkn6nZBf7FMscyS1lVDDFIn2isxKOWHIMJVhn4ypivKlTq7DfDwb-T/exec";

    function log(msg) {
      const el = document.getElementById("log");
      el.textContent += "[" + new Date().toLocaleTimeString() + "] " + msg + "\n";
    }

    function runTest() {
      const btn = document.getElementById("testBtn");
      btn.disabled = true;
      document.getElementById("log").textContent = "";
      
      log("Kapcsolódás indítása a Google Apps Scripthez...");
      log("URL: " + APPS_SCRIPT_URL);

      const payload = {
        pin: document.getElementById("pin").value,
        blokk: "Teszt Blokk",
        muszeresz: "Teszt Elek",
        mut: "TEST-001",
        alfanumerika: "TEST-123",
        statusz: "Folyamatban",
        datum: new Date().toISOString().split('T')[0],
        ciklusfigyeles: false,
        megjegyzes: "Automata teszt üzenet"
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => {
        log("Válasz státusz kód: " + res.status + " " + res.statusText);
        return res.json();
      })
      .then(data => {
        log("Sikeres válasz érkezett a szervertől:");
        log(JSON.stringify(data, null, 2));
      })
      .catch(err => {
        log("HIBA TÖRTÉNT:");
        log(err.toString());
        log("Tipp: Ha 'Failed to fetch' hiba van, a Google Apps Script 'Who has access' beállítása nem 'Anyone'.");
      })
      .finally(() => {
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
